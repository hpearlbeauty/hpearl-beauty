name: Hourly reminders

# Vercel Hobby crons run once a day, so GitHub Actions calls the reminder
# endpoint every hour. Needs repo secret CRON_SECRET and repo variable SITE_URL.
on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Call /api/cron/reminders
        run: |
          set -e
          code=$(curl -sS -o /tmp/out.json -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ vars.SITE_URL }}/api/cron/reminders")
          cat /tmp/out.json; echo
          test "$code" = "200"
